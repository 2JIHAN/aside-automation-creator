name: Installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths:
      - '**/*.mjs'
      - '**/*.ps1'
      - '**/*.sh'
      - 'installer/macos/**'
      - 'installer/windows/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - '**/*.mjs'
      - '**/*.ps1'
      - '**/*.sh'
      - 'installer/macos/**'
      - 'installer/windows/**'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: read
jobs:
  node-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: pwsh
        run: |
          $index = Invoke-RestMethod https://nodejs.org/dist/index.json
          $version = ($index | Where-Object { $_.lts } | Select-Object -First 1).version
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw 'No exact Node LTS version found.' }
          "version=$version" >> $env:GITHUB_OUTPUT
  test:
    needs: node-version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.node-version.outputs.version }}
      - name: Test Windows PowerShell and PowerShell Core
        shell: pwsh
        env:
          POWERSHELL_EXE: ${{ matrix.powershell }}
        run: |
          node --check engine.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(Get-ChildItem tests/windows-*.test.mjs | ForEach-Object FullName)
          node --test @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  build:
    needs: node-version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build native Setup with verified portable Node
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          NODE_VERSION: ${{ needs.node-version.outputs.version }}
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:RELEASE_REF -replace '^v', '' }
          ./installer/windows/build.ps1 -Architecture $env:TARGET_ARCH -NodeVersion $env:NODE_VERSION -Version $version -OutputDirectory "$env:RUNNER_TEMP/setup-output"
      - name: Smoke test x64 Setup with fixture profile and official CLI install
        if: matrix.architecture == 'x64'
        shell: pwsh
        env:
          EXPECTED_NODE_VERSION: ${{ needs.node-version.outputs.version }}
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'setup-smoke'
          $env:ASIDE_HOME = Join-Path $fixture 'aside'
          $env:LOCALAPPDATA = Join-Path $fixture 'localappdata'
          $profile = Join-Path $env:ASIDE_HOME 'u/0'
          $cli = Join-Path $env:LOCALAPPDATA 'Aside/CLI/current/aside.exe'
          $repository = Join-Path $HOME '.local/share/aside-automation-creator'
          if (Test-Path -LiteralPath $repository) { throw 'Smoke test refuses an existing canonical repository.' }
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          if (Test-Path -LiteralPath (Split-Path -Parent $cli)) { throw 'Fresh CLI fixture must not precreate the current junction path.' }
          $setup = @(Get-ChildItem "$env:RUNNER_TEMP/setup-output/*-Setup.exe")
          if ($setup.Count -ne 1) { throw 'Expected one x64 Setup executable.' }
          $log = Join-Path $fixture 'setup.log'
          $result = Start-Process -FilePath $setup[0].FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="' + $log + '"')) -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            throw "Setup smoke test failed (exit $($result.ExitCode))."
          }
          foreach ($path in @((Join-Path $profile 'skills/user/aside-automation-creator/SKILL.md'), (Join-Path $repository 'engine.mjs'), (Join-Path $repository 'runtime/node.exe'))) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing installed payload: $path" }
          }
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw 'Official Aside CLI was not installed.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $cli
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -ne 'CN=AT YOUR SIDE INC, O=AT YOUR SIDE INC, L=San Francisco, S=California, C=US' -or $null -eq $signature.TimeStamperCertificate) { throw 'Installed Aside CLI signature was not verified.' }
          $version = & (Join-Path $repository 'runtime/node.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -ne $env:EXPECTED_NODE_VERSION) { throw 'Installed bundled Node did not execute with the expected version.' }
          Write-Output "PASS x64 Setup smoke: fixture profile, official signed CLI installation, packaged source deployment, bundled Node $version. No real browser, login, or automation execution tested."
      - name: Show installer diagnostics after failure
        if: failure() && matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $roots = @((Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Aside/AutomationCreator/InstallerLogs'), (Join-Path $env:RUNNER_TEMP 'setup-smoke/localappdata/Aside/AutomationCreator/InstallerLogs'))
          $logs = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File -ErrorAction SilentlyContinue } | Where-Object { $_.Name -in @('error.txt', 'install.log') })
          foreach ($file in $logs) { Write-Output ('--- ' + $file.FullName); Get-Content -LiteralPath $file.FullName }
          $setupLog = Join-Path $env:RUNNER_TEMP 'setup-smoke/setup.log'
          if (Test-Path -LiteralPath $setupLog) { Get-Content -LiteralPath $setupLog }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup-${{ matrix.architecture }}
          path: ${{ runner.temp }}/setup-output/*-Setup.exe
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Test macOS package installation without real profiles
        run: ASIDE_AUTOMATION_CREATOR_REPO="$PWD" node --test assets/template/tests/scenario.test.mjs tests/install-to-aside.test.mjs tests/macos-*.test.mjs
      - name: Build universal macOS installer for review
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${RELEASE_REF#v}"; fi
          bash installer/macos/build.sh --build "$RUNNER_TEMP/setup-output" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-setup
          path: ${{ runner.temp }}/setup-output/*-Setup.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, macos]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-setup*'
          merge-multiple: true
          path: release-assets
      - name: Publish Setup executables and SHA256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem release-assets -File | Where-Object { $_.Name -like '*-Setup.exe' -or $_.Name -like '*-Setup.dmg' } | Sort-Object Name)
          if ($files.Count -ne 3) { throw 'Expected Windows x64, Windows arm64 and universal macOS installers.' }
          $lines = $files | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'release-assets/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --draft --title $env:RELEASE_TAG --notes 'Draft release. macOS CI output is ad-hoc signed and must be replaced with the locally signed and notarized DMG before publishing. Windows Setup is unsigned. Aside must already be installed and opened once. No Git or Node prerequisite.'
            if ($LASTEXITCODE -ne 0) { throw 'Creating GitHub Release failed.' }
          }
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading GitHub Release assets failed.' }
